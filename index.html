<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Hybrid VFL Predictive Engine</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1080px; margin: 0 auto; }
    
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; color: var(--text-main); }

    .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .input-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
    .input-section h3 { font-size: 1rem; margin-bottom: 8px; color: var(--text-muted); }

    textarea { width: 100%; height: 110px; background: #090d16; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; resize: vertical; margin-bottom: 12px; }

    .actions { display: flex; gap: 8px; }
    .btn { padding: 9px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 0.85rem; }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent-blue); color: #fff; }
    .btn-danger { background: var(--accent-red); color: #fff; }
    .btn-save { background: var(--accent-green); color: #fff; }

    .match-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .match-title { font-size: 1.1rem; }

    .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
    .home-win { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .draw-win { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
    .away-win { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

    .alert { padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; font-weight: 500; }
    .alert-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-warning { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .odds-box { background: #090d16; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid var(--border-color); }
    .odds-box.highlight { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }
    .odds-box .label { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .odds-box .value { font-size: 1.1rem; font-weight: bold; }

    .stats-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .kelly-value { color: var(--accent-green); font-weight: bold; }

    .result-input-row { display: flex; gap: 8px; align-items: center; }
    .result-input-row input { width: 100px; padding: 6px; background: #090d16; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1rem; }

    @media (max-width: 768px) {
      .grid-inputs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>VFL Hybrid Predictive Engine</h1>
      <div class="actions">
        <button class="btn btn-primary" id="btnExportJSON">Export JSON</button>
        <label class="btn btn-primary" style="cursor: pointer; margin: 0;">
          Import JSON
          <input type="file" id="fileImportJSON" accept=".json" style="display: none;" />
        </label>
        <button class="btn btn-danger" id="btnClearHistory">Reset History DB</button>
      </div>
    </header>

    <div class="grid-inputs">
      <!-- 1. Fixture Parsing Section -->
      <div class="input-section">
        <h3>1. Paste Fixtures & Odds</h3>
        <textarea id="rawClipboardInput" placeholder="Arsenal vs Chelsea&#10;1.80 3.40 4.20"></textarea>
        <button class="btn btn-primary" id="btnParseGameweek">Analyze Gameweek</button>
      </div>

      <!-- 2. Results Pasting Section -->
      <div class="input-section">
        <h3>2. Paste Gameweek Results</h3>
        <textarea id="rawResultsInput" placeholder="Arsenal 2 - 1 Chelsea&#10;Liverpool 0 - 0 Everton"></textarea>
        <button class="btn btn-save" id="btnParseResults">Save Bulk Results</button>
      </div>
    </div>

    <main id="predictionsContainer">
      <!-- Dynamic Prediction Match Cards will be rendered here -->
    </main>
  </div>

  <script src="dynamic-history.js"></script>
  <script src="script.js"></script>
</body>
</html>
